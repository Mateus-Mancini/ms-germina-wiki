# PR checks (required on main) and the reusable check stage of release.yml.
# Contract: specs/003-ci-cd/contracts/pipelines.md. No job here touches production.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAM_CLI_TELEMETRY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Tests (unit, web, Testcontainers on PostgreSQL 18)
        run: ./mvnw -B -ntp verify

      - name: Usage guard tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s infra/guard

      - name: Package Lambda zip
        run: ./mvnw -B -ntp -Plambda -DskipTests clean package

      - name: Smoke test the packaged Lambda
        run: scripts/smoke-lambda-package.sh

      - name: Validate infrastructure templates
        run: |
          sam validate --lint --region sa-east-1
          sam validate --lint --region sa-east-1 -t infra/github-oidc.yaml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  migrations-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- src/main/resources/db/migration | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Rehearses new/changed migrations on a disposable Neon branch of production (deleted afterwards).
  # The Neon API key can manage production data, so the environment requires the owner's approval
  # before this job (and the secret) runs; PRs from forks never receive it.
  rehearse-migrations:
    needs: [build-test-package, migrations-changed]
    if: needs.migrations-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: neon-rehearsal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rehearse migrations on a Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: scripts/db-migrate.sh rehearse
