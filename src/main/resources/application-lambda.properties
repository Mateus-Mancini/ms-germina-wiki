# Production on AWS Lambda (SPRING_PROFILES_ACTIVE=lambda). Datasource comes from SPRING_DATASOURCE_* env vars.

# No API docs in production: less startup work and less public surface.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN
logging.level.com.wikigerminare=INFO

# Complete database waits before the 20-second Lambda deadline. Hikari's acquisition
# timeout alone does not bound an established connection waiting on SQL or a socket.
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.data-source-properties.queryTimeout=8
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=2
