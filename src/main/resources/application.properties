spring.application.name=wikigerminare
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
wikigerminare.content.base-url=${CONTENT_SERVICE_URL:}
spring.main.banner-mode=off

# JPA: the schema is managed outside Hibernate, and nothing touches the DB at startup,
# so a SnapStart snapshot never contains an open connection.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Hikari: one request per Lambda instance at a time; the pool is suspended on SnapStart checkpoint.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.allow-pool-suspension=true
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
